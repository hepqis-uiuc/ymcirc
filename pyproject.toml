[project]
name = "ymcirc"
version = "0.2.0"
description = "Quantum circuits to simulate lattice SU(3) gauge theories"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "matplotlib~=3.11",
    "matplotlib-label-lines~=0.7.0",
    "numpy~=2.5",
    "pandas~=3.1",
    "pyclebsch @ git+https://github.com/hepqis-uiuc/pyclebsch.git@v0.3.0",
    "pylatexenc~=2.11",
    "qiskit~=2.6",
    "qiskit-aer~=0.18",
    "qiskit-qasm3-import~=0.6",
    "scipy~=1.18",
]

[dependency-groups]
dev = [
    "pytest~=9.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ymcirc*"]
